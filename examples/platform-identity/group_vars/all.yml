---
vault_server_image: "hashicorp/vault:1.19.5"
vault_server_api_port: 8200
vault_server_cluster_name: "platform-identity"
vault_server_data_dir: "/var/lib/vault"

# OIDC auth backend wiring — this org integrates Vault with its IdP (could be Entra, Keycloak,
# Authentik...). The endpoint/credentials are caller-supplied; the role discovers nothing.
vault_integration_oidc_endpoint: "https://idp.example.internal/.well-known/openid-configuration"
vault_integration_oidc_client_id: "vault"
# vault_integration_oidc_client_secret injected by CI / a secret backend at runtime
